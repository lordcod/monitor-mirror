name: Build Mirror for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'cpp/**'
      - '.github/workflows/windows-build.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
      - name: Build exe
        shell: msys2 {0}
        run: |
          cd cpp
          windres app.rc -O coff -o app.res
          g++ -std=c++17 -O2 -municode -mwindows -static -static-libgcc -static-libstdc++ \
            mirror.cpp config_gui.cpp app.res -o mirror.exe \
            -ld3d11 -ldxgi -ld3dcompiler -lgdi32 -ldwmapi -luuid -lole32 -lcomdlg32 -lwinmm -lcomctl32
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MonitorMirror-modified-Windows-x64
          path: cpp/mirror.exe
